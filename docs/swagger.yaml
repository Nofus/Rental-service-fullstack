openapi: 3.0.0
info:
  title: Housing Rental API
  version: 1.0.0
  description: API для работы с предложениями, отзывами и пользователями
servers:
  - url: http://localhost:5000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: Users
  - name: Offers
  - name: Reviews
paths:
  /register:
    post:
      summary: Регистрация нового пользователя
      tags:
        - Users
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - password
                - userType
                - username
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                  maxLength: 12
                userType:
                  type: string
                  enum:
                    - normal
                    - pro
                username:
                  type: string
                  minLength: 1
                  maxLength: 15
                avatar:
                  type: string
                  format: binary
            example:
              email: user@gmail.com
              password: password123
              userType: normal
              username: john_doe
      responses:
        "200":
          description: Успешная регистрация
        "400":
          description: Ошибка валидации
  /login:
    post:
      summary: Авторизация пользователя
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: Lucio59@gmail.com
              password: md7d_mPC5D
      responses:
        "200":
          description: Успешный логин, возвращает токен
        "400":
          description: Неверный email или пароль
  /logout:
    delete:
      summary: Выход из системы
      tags:
        - Users
      responses:
        "204":
          description: Успешный выход
  /offers:
    get:
      summary: Получение списка всех предложений
      tags:
        - Offers
      responses:
        "200":
          description: Список предложений
    post:
      summary: Создание нового предложения
      description: >
        Создает новое предложение (offer). Принимает данные в формате
        multipart/form-data. Поле previewImage обязательно.
      tags:
        - Offers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - description
                - city
                - type
                - rooms
                - guests
                - price
                - previewImage
              properties:
                title:
                  type: string
                description:
                  type: string
                publishDate:
                  type: string
                  format: date
                city:
                  type: string
                  enum:
                    - Paris
                    - Cologne
                    - Brussels
                    - Amsterdam
                    - Hamburg
                    - Dusseldorf
                isPremium:
                  type: boolean
                  default: false
                isFavorite:
                  type: boolean
                  default: false
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
                type:
                  type: string
                  enum:
                    - apartment
                    - house
                    - room
                    - hotel
                rooms:
                  type: integer
                guests:
                  type: integer
                price:
                  type: number
                features:
                  type: string
                  description: JSON-строка массива из значений 'Breakfast', 'Air conditioning',
                    'Laptop friendly workspace', 'Baby seat', 'Washer',
                    'Towels', 'Fridge'
                commentsCount:
                  type: integer
                latitude:
                  type: number
                longitude:
                  type: number
                userId:
                  type: integer
                previewImage:
                  type: string
                  format: binary
                  description: Основное изображение (обязательно)
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Дополнительные изображения
            examples:
              generated:
                summary: Сгенерированный пример (только текстовые поля)
                value:
                  title: censura ipsum non
                  description: Strues tutamen vallum spiculum denique absconditus. Solum vester
                    tertius. Adiuvo officiis vulnus averto cito vesica.
                  publishDate: 2026-03-16
                  city: Hackettworth
                  isPremium: false
                  isFavorite: true
                  rating: 4.3
                  type: room
                  rooms: 5
                  guests: 5
                  price: 443
                  features: '["Breakfast","Air conditioning","Laptop friendly workspace","Baby
                    seat","Washer","Towels","Fridge"]'
                  commentsCount: 47
                  latitude: 49.528
                  longitude: 31.1577
                  userId: 10
      responses:
        "201":
          description: Предложение успешно создано
        "400":
          description: Ошибка валидации данных
        "401":
          description: Не авторизован
  /offers/{id}:
    get:
      summary: Получение детальной информации о предложении
      tags:
        - Offers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Детальная информация о предложении
        "404":
          description: Предложение не найдено
  /favorite:
    get:
      summary: Получение избранных предложений
      tags:
        - Offers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список избранных предложений
        "401":
          description: Не авторизован
  /favorite/{offerId}/{status}:
    post:
      summary: Добавление/удаление предложения в избранное
      tags:
        - Offers
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: path
          required: true
          schema:
            type: integer
            enum:
              - 0
              - 1
      responses:
        "200":
          description: Статус обновлен
        "401":
          description: Не авторизован
        "404":
          description: Предложение не найдено
  /comments/{offerId}:
    get:
      summary: Получение комментариев к предложению
      tags:
        - Reviews
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Список комментариев
    post:
      summary: Добавление комментария
      tags:
        - Reviews
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - comment
                - rating
              properties:
                comment:
                  type: string
                  minLength: 5
                  maxLength: 1024
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
            example:
              comment: Отличное место, очень понравилось!
              rating: 5
      responses:
        "201":
          description: Комментарий добавлен
        "400":
          description: Ошибка валидации
        "401":
          description: Не авторизован
